<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f2f2" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Explore oral and maxillofacial anatomy in 3D. An educational atlas for dental students, dentists, and specialists."
    />
    <title>OMF Atlas | Oral & maxillofacial anatomy</title>
    <!-- Google tag (gtag.js). googletagmanager.com and google-analytics.com
         have to be named in the site's Content-Security-Policy or the browser
         blocks this silently; see deploy/omfatlas.xera.ac.nginx. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LCRYBDSQEP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-LCRYBDSQEP");
    </script>
  </head>
  <body>
    <script>
      // Resolve the theme before the first paint, so a dark mode reader never
      // sees a white flash. The stored choice wins; otherwise follow the system.
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("omf-theme");
        } catch {}
        if (theme !== "dark" && theme !== "light")
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
